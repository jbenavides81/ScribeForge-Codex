name: Report a problem
description: Something in ScribeForge doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please **don't attach private PDFs**, or anything with your own or other people's details in it: this page is public.
        If a particular file causes the problem, describe it instead (how many pages, where it came from, whether it has a password, forms or signatures), or make a test file that shows the same problem.
        For a security problem (for example, redacted text that can still be found, or the vault opening without the password), please use the private route instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open a 3-page PDF with a form.
        2. Go to Pages and rotate page 2.
        3. Save as a new file.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScribeForge version
      description: It's on the About screen.
      placeholder: "1.9.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings > System > About shows it.
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A message ScribeForge showed, or a screenshot (check it shows nothing private first).
