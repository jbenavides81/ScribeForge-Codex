appId: com.bc6.scribeforge
productName: ScribeForge
copyright: Copyright © 2026 BC6
directories:
  output: release
  buildResources: build
# Everything the app uses is bundled into out/ at build time, so no node_modules ship.
files:
  - out/**
  - package.json
extraResources:
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: LICENSE
# The command-line launcher, next to ScribeForge.exe.
extraFiles:
  - from: build/scribeforge.cmd
    to: scribeforge.cmd
asar: true
# Electron's built-in switches, set in the program file itself (Phase 2 plan, 2a). The inspect
# switch stays on: the whole-app tests drive the installed build through it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  grantFileProtocolExtraPrivileges: false
  enableCookieEncryption: false
  loadBrowserProcessSpecificV8Snapshot: false
npmRebuild: false
# ScribeForge never checks for updates, so no files for automatic updates are made (stop 4c).
publish: null
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName} Setup ${version}.${ext}
  differentialPackage: false
  shortcutName: ScribeForge
  uninstallDisplayName: ScribeForge
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
